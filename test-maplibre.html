<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MapLibre + OpenFreeMap Test</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css"
    >

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #status {
            position: absolute;
            z-index: 9999;
            top: 10px;
            left: 10px;
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="status">
    Loading MapLibre...
</div>

<script type="module">

    import * as maplibregl
        from "https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs";

    console.log("MapLibre module:", maplibregl);
    console.log("MapLibre Map:", maplibregl.Map);

    const status = document.getElementById("status");

    status.textContent = "MapLibre loaded. Creating map...";

    const map = new maplibregl.Map({

        container: "map",

        style: "https://tiles.openfreemap.org/styles/liberty",

        center: [
            45.0783,
            37.5497
        ],

        zoom: 15
    });

    map.on("load", () => {

        console.log("MapLibre map loaded.");

        status.textContent =
            "MapLibre + OpenFreeMap loaded successfully";

        setTimeout(() => {
            status.remove();
        }, 3000);
    });

    map.on("error", (event) => {

        console.error("MapLibre error:", event);

        status.textContent =
            "MapLibre map error — see Console";

    });

</script>

</body>
</html>
