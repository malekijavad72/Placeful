<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeful</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
</head>

<body>

  <header class="app-header">
    <div class="header-brand">
      <h1>Placeful</h1>
      <p>Human experiences, mapped.</p>
    </div>

    <div class="auth-actions">
      <button id="sign-in-btn" class="auth-btn" type="button">Sign In</button>
      <button id="sign-up-btn" class="auth-btn auth-btn-primary" type="button">Sign Up</button>

      <div id="user-menu" class="user-menu" style="display: none;">
        <span id="logged-in-username"></span>
        <button id="logout-btn" class="auth-btn" type="button">Log Out</button>
      </div>
    </div>
  </header>

  <main>

    <section id="experience-map" class="experience-map-section">
      <div id="full-map-container">
        <div id="full-map"></div>

        <div id="experiences-error" class="experiences-error">
          Unable to load experiences. Please try again.
        </div>

        <button
          id="add-experience-btn"
          class="add-experience-btn"
          type="button"
          aria-label="Add an experience"
        >
          <span class="add-experience-icon">+</span>
          <span>Add experience</span>
        </button>

        <div id="emotion-legend" class="emotion-legend">
          <div class="legend-header">
            <span class="legend-title">Explore by feeling</span>
            <button id="legend-toggle" type="button" aria-label="Hide emotion filters">−</button>
          </div>

          <div id="legend-content" class="legend-content">
            <button class="legend-item active" data-emotion="all" type="button">
              <span class="legend-emoji">🌎</span>
              <span class="legend-label">All</span>
            </button>
            <button class="legend-item" data-emotion="happy" type="button">
              <span class="legend-emoji">😊</span>
              <span class="legend-label">Happy</span>
            </button>
            <button class="legend-item" data-emotion="sad" type="button">
              <span class="legend-emoji">😢</span>
              <span class="legend-label">Sad</span>
            </button>
            <button class="legend-item" data-emotion="peaceful" type="button">
              <span class="legend-emoji">😌</span>
              <span class="legend-label">Peaceful</span>
            </button>
            <button class="legend-item" data-emotion="excited" type="button">
              <span class="legend-emoji">🤩</span>
              <span class="legend-label">Excited</span>
            </button>
            <button class="legend-item" data-emotion="nostalgic" type="button">
              <span class="legend-emoji">🥹</span>
              <span class="legend-label">Nostalgic</span>
            </button>
            <button class="legend-item" data-emotion="love" type="button">
              <span class="legend-emoji">❤️</span>
              <span class="legend-label">Love</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- =====================================================
         EXPERIENCE SIDEBAR (replaces popup)
         ===================================================== -->
    <aside id="experience-sidebar" class="experience-sidebar" aria-hidden="true">
      <div class="sidebar-header">
        <span class="sidebar-header-label">Experience</span>
        <button id="sidebar-close" type="button" class="sidebar-close" aria-label="Close experience">×</button>
      </div>

      <div class="sidebar-body">
        <div class="sidebar-experience">
          <div id="sidebar-emotion" class="sidebar-emotion" hidden></div>
          <h2 id="sidebar-title">Experience</h2>
          <p id="sidebar-story">Story</p>

          <div class="sidebar-like-container">
            <button id="sidebar-like-btn" class="sidebar-like-btn" type="button">
              <span id="sidebar-like-icon" class="sidebar-like-icon">♡</span>
              <span id="sidebar-like-text" class="sidebar-like-text">Like</span>
              <span id="sidebar-like-count" class="sidebar-like-count">0</span>
            </button>
            <span id="sidebar-like-message" class="sidebar-like-message"></span>
          </div>
        </div>

        <div id="comments-section" class="comments-section">
          <div class="comments-header">
            <h3>Comments</h3>
            <span id="comments-count" class="comments-count">0</span>
          </div>

          <div id="comment-form-container" class="comment-form-container">
            <textarea
              id="comment-input"
              class="comment-input"
              rows="2"
              maxlength="5000"
              placeholder="Share your thoughts..."
            ></textarea>

            <div class="comment-form-actions">
              <span id="comment-login-message" class="comment-login-message"></span>
              <button id="submit-comment-btn" type="button" class="submit-comment-btn">
                Comment
              </button>
            </div>
          </div>

          <div id="comments-list" class="comments-list">
            <div id="comments-loading" class="comments-message">
              Loading comments...
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- =====================================================
         ADD EXPERIENCE FORM
         ===================================================== -->
    <div id="experience-form-overlay" class="experience-form-overlay">
      <div class="experience-form">
        <button id="close-experience-form" class="close-form-btn" type="button" aria-label="Close form">×</button>

        <h2>Add Experience</h2>
        <p class="form-description">Share your experience from a place.</p>

        <form id="experience-form">
          <div class="form-group">
            <label for="experience-title">Title</label>
            <input
              type="text"
              id="experience-title"
              name="title"
              placeholder="e.g. A memorable afternoon"
              required
            >
          </div>

          <div class="form-group">
            <label for="experience-description">Story</label>
            <textarea
              id="experience-description"
              name="description"
              rows="5"
              placeholder="What happened at this place?"
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="experience-emotion">Emotion</label>
            <select id="experience-emotion" name="emotion" required>
              <option value="">Select an emotion</option>
              <option value="happy">😊 Happy</option>
              <option value="sad">😢 Sad</option>
              <option value="peaceful">😌 Peaceful</option>
              <option value="excited">🤩 Excited</option>
              <option value="nostalgic">🥹 Nostalgic</option>
              <option value="love">❤️ Love</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="button" id="cancel-experience" class="cancel-btn">Cancel</button>
            <button type="submit" class="submit-experience-btn">Save Experience</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <script src="js/map.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
